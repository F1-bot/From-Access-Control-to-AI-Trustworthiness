procedure:
  IV-2: 'event recall >= 0.50: exact Clopper-Pearson and effective-n bound with the dependency-graph design effect over attack primitives (decision on the latter);
    false alarms <= 0.25/h: exact Poisson bound, dispersion check and quasi-Poisson widening'
  IO-2: alarms per hour over the test period <= 6, exact Poisson bound
  IE-2: 'process localisation (sum rule) >= 0.60 and superiority over the constant explainer ''P1'' (most frequently targeted process in the schedule): exact one-sided
    McNemar test with the dependency-graph design effect of the paired differences'
  IR-2: 'TM-A, success over the ball eps <= 0.5 (0.1, 0.25, 0.5) with the strongest attack: union of the planned PGD (60 steps), the improved PGD (5 restarts, 200
    steps, greedy warm start) and greedy prediction replay; both PGD variants minimise the smoothed score (as planned) and the improved PGD is also run with an objective
    adapted to the on-delay (minimum of the smoothed score over every 20-s window); concealment is judged with the deployed alarm logic; detected attacks as units;
    unbounded ceiling (eps = 5) reported'
  IR-1: greedy transfer from a surrogate trained on historical normal data; hardening-aware surrogate for the hardened variant; query-based chain (score and label
    interfaces, Q = 1e3, 1e4, 1e5); reported without threshold
  IP-2: label-only extraction at Q = 1e4, seeds 0-2, 1-D CNN surrogate; fidelity (balanced agreement) on all time-ordered operational test windows with moving-block
    (600 s) and test-file cluster bootstrap bounds; attacker distribution reported
  ID-3: 'poisoning drill, simple replication, beta = 1%; planned sanitiser (trusted model on train1, seed 100, 99.5th percentile of its validation window scores);
    detection with the poisoned traces as units (percentile cluster bootstrap, B = 10000) and clean removal <= 0.05; degradation: poisoned versus clean pipeline with
    the same recipe, three seeds each, an attack detected by a pipeline if at least two of its models detect it; exact paired bound'
  IV-3: 'hourly operating-envelope monitor: share of the readings of the channels shared with HAI 22.04 that lie outside the range of the clean training data; threshold
    fixed under parameters/drift_monitor; positives = full hours of the HAI 22.04 training files; negatives = hours of the 21.03 test files with more than 90% normal
    seconds (E5 mask); requirement TPR >= 0.90 and FPR <= 0.05; exact bounds with an effective sample size n/deff, deff = (1 + rho)/(1 - rho) from the lag-1 autocorrelation
    of the hourly statistic within files (at least 1)'
  IM-2: 'Ed25519 signature over a release manifest, verified against a trust anchor pinned outside the envelope; tests: original, one modified byte, foreign-key re-signature,
    replaced anchor'
  ratings: evidence classes as in the 22.04 study, file replication_evidence.yaml (SHA-256 aef6de8f434b895eaed3333fa3f27b8b8ce08914adf50b8d9c0b816c4d3556d6); demonstrated
    and conditional ratings
design_changes_required_by_the_check:
- item: alarm on-delay
  reason: the false-alarm failure of the 22.04 study was foreseeable from the validation data; most false alarms there were fleeting (median 10 s); a 20-s on-delay
    met the requirement for both 22.04 detectors
  on_delay_s: 20
- item: operating point
  reason: the 99.9th percentile is kept only if its validation false-alarm rate predicts acceptance with probability >= 0.8
- item: drift monitor
  reason: daily windows are not decidable (1 in-distribution day; 59 needed); with hourly windows the PSI monitor of the 22.04 plan (threshold 0.25) flags 1.00 of
    the in-distribution training hours, so it is replaced by an operating-envelope monitor calibrated by leave-one-file-out
  psi_pilot_fpr_training_hours: 1.0
  envelope_threshold: 0.04492630385487528
  calibration:
    lofo_hours: 229
    lofo_max: 0.04492630385487528
    validation_hours: 26
    validation_max: 0.0020975056689342404
  drift_pilot_hai2305:
    hours: 249
    tpr: 1.0
    min_statistic: 0.08537262872628726
    channels: 41
- item: poisoning drill
  reason: at least 14 traces are needed for a decidable detection test; windows without attack samples cap window-level detection
  poison_source: test2
  poison_traces: 20
  poison_segment: attack interval with the W-second input history
  poison_windows_per_replica: 3449
  evaluation_attacks: 30
  evaluation_attacks_sharing_a_poisoned_primitive: 24
- item: degradation measurement
  reason: with single models, training noise alone predicts acceptance with probability 0.55; a three-seed majority vote per pipeline separates the effect of poisoning
    from training noise
