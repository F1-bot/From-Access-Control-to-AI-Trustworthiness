# Evidence for every requirement of the class-I levels of the reference profile 3.CDI.ICS/G-4
# (requirement texts: code/aitcert/spec/ai_services.yaml; numbering <level>.<k> follows the order of the requirements).
# status:
#   D   documented: shown by an artefact produced in this study (evaluation plan, manifests, ML-BOM with model card, code)
#   T   tested: a quantitative test; its decision (accept / reject / inconclusive, or 'reported' for tests without a
#       threshold) is computed by assess_case_v2.py
#   A   assumed: provided by the hosting platform or by the operator's procedures (outside the evaluated AI component);
#       a composite evaluation would rely on the platform's certificate and an operator audit
#   NA  not applicable: declared in the security target with a reason
#   NE  not evaluated in this study
# A level is "demonstrated" if all its requirements (and those of lower levels) are D, NA or T-accepted/reported;
# "conditional" if, in addition, some are A; otherwise it is not attained. Ratings are int() of the attained profile
# joined with the platform's legacy services (3.CD.3 and KA-1) at G-4 (Catalogue.interior).
ID-1:
  - {req: ID-1.1, status: D, evidence: "Dataset scope fixed in the evaluation plan (File S4): HAI 22.04 train1-6, test1-4; HAI 23.05 for drift"}
  - {req: ID-1.2, status: D, evidence: "Source, licence and collection documented by the maintainers; pre-processing specified in prep.json and Section 3.7"}
  - {req: ID-1.3, status: D, evidence: "SHA-256 content manifest of every data file (data/raw/hai/MANIFEST.json); digests listed in the ML-BOM"}
ID-2:
  - {req: ID-2.1, status: D, evidence: "All datasets used are covered by the manifest"}
  - {req: ID-2.2, status: NE, evidence: "Digests were verified at acquisition only; the evaluated pipeline does not verify them before each training or evaluation run (a retrospective check is reported)"}
  - {req: ID-2.3, status: A, evidence: "Role-based modification rights and protected logging are platform or operator controls (CA-1, NR-2)"}
ID-3:
  - {req: ID-3.1, status: D, evidence: "Data obtained over HTTPS from the maintainers' repository and verified against the Git-LFS SHA-256 object identifiers"}
  - {req: ID-3.2, status: D, evidence: "Statistical screening (trusted-subset sanitiser; cross-fitted sanitiser) applied before training (E3, E3b, E3c)"}
  - {req: ID-3.3, status: T, tests: [ID-3.pdet, ID-3.pdeg], evidence: "Poisoning drill at beta = 1% (E3); trace-level re-analysis"}
IR-1:
  - {req: IR-1.1, status: D, evidence: "Threat models TM-ALL/TM-A/TM-B, L_inf budget, attacker knowledge and query budget declared in the evaluation plan and Section 3.7"}
  - {req: IR-1.2, status: T, tests: [IR-1.transfer, IR-1.query], evidence: "Transfer (surrogate) and query-based (extraction-then-transfer) black-box attacks, reported with exact CIs; no threshold at this level"}
IR-2:
  - {req: IR-2.1, status: T, tests: [IR-2.asr], evidence: "Adaptive white-box attacks over the declared ball (PGD as planned, improved PGD, greedy prediction replay)"}
  - {req: IR-2.2, status: D, evidence: "Hardening (input-channel corruption) documented and evaluated with adaptive white-box attacks; transfer resistance re-tested with a hardening-aware surrogate (obscurity not credited)"}
IV-1:
  - {req: IV-1.1, status: D, evidence: "Intended purpose, operational domain and metrics declared in the evaluation plan"}
  - {req: IV-1.2, status: T, tests: [IV-1.report], evidence: "Event recall and false-alarm rate measured on the held-out test files and reported with exact bounds"}
IV-2:
  - {req: IV-2.1, status: T, tests: [IV-2.recall, IV-2.far], evidence: "Acceptance tests on the held-out test files; delta declared post hoc (0.2)"}
  - {req: IV-2.2, status: D, evidence: "Results reported per test file and operating point; outputs are not probabilistic, so calibration does not apply"}
IV-3:
  - {req: IV-3.1, status: T, tests: [IV-3.daily], evidence: "Pre-specified daily PSI drift test (E5); hourly monitors exploratory"}
  - {req: IV-3.2, status: NA, evidence: "No uncertainty sets are produced by the detector"}
IE-1:
  - {req: IE-1.1, status: D, evidence: "Model card in the CycloneDX ML-BOM (purpose, limitations, metrics)"}
  - {req: IE-1.2, status: NA, evidence: "No natural-person interaction with AI-generated content; alarms are labelled as detector output in the model card"}
IE-2:
  - {req: IE-2.1, status: A, evidence: "Per-alarm attribution is produced by the pipeline; presentation to and recording by the SOC system are operator integration"}
  - {req: IE-2.2, status: T, tests: [IE-2.xfid], evidence: "Process-localisation accuracy of the explanations (E1), against the planned threshold and against trivial explainers (E1b)"}
IP-1:
  - {req: IP-1.1, status: D, evidence: "No personal data; the declared interface returns the alarm bit only (label-only)"}
  - {req: IP-1.2, status: A, evidence: "Model-access policy is an operator control (KA-1)"}
IP-2:
  - {req: IP-2.1a, status: NA, evidence: "Membership inference: training data are public process recordings without personal or confidential records ('applies' clause of IP-2)"}
  - {req: IP-2.1b, status: T, tests: [IP-2.ext], evidence: "Extraction resistance at Q = 10^4, label-only (E4b; dependent-data re-analysis; E4c exploratory)"}
  - {req: IP-2.2, status: A, evidence: "Per-identity query quotas and logging are platform controls (DR-1, NR-2)"}
IO-1:
  - {req: IO-1.1, status: A, evidence: "Oversight roles and the ability to override or stop belong to the operator's SOC procedures"}
  - {req: IO-1.2, status: D, evidence: "Model card in the ML-BOM states the oversight mode: advisory detection for ICS operators, human-on-the-loop"}
IO-2:
  - {req: IO-2.1, status: D, evidence: "By design the detector only raises alarms; no output takes effect without operator action"}
  - {req: IO-2.2a, status: T, tests: [IO-2.load], evidence: "Alarm workload measured on the 22.04 test campaign"}
  - {req: IO-2.2b, status: A, evidence: "Automation-bias countermeasures (operator training, uncertainty cues) are operator procedures"}
IM-1:
  - {req: IM-1.1, status: D, evidence: "CycloneDX 1.6 ML-BOM with model card, dataset digests and library versions"}
  - {req: IM-1.2, status: A, evidence: "Vulnerability monitoring of listed components is an operator process enabled by the ML-BOM"}
IM-2:
  - {req: IM-2.1, status: T, tests: [IM-2.sig], evidence: "Ed25519 signature verified against a pinned trust anchor; negative tests (modified artefact, foreign key, replaced anchor)"}
  - {req: IM-2.2, status: D, evidence: "safetensors serialisation (no code execution on load)"}
